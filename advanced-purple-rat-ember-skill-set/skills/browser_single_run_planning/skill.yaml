  measurement:
    proxy_metric_id: browser_window_stranding_rate
    success_criterion: In sampled browser tasks during the window, no task loses completed steps to a closed window without a pre-staged rebuild path, no parked tab is reported as waiting for the user, and no outcome is promised on a page type before the lane is verified to reach it.
