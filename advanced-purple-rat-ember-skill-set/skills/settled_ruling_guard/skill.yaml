  rationale: 'The Oct 23 re-prompt of VNA was not caused by the check-in worker ignoring the guard. The worker followed its definition: cron rule 3 reads ruled-items.md every run, and that ledger held no VNA entry, while rule 4''s topic pool still listed ''VNA spelling (nucleic acid vs neutralizing antibody)'' as an open thread. The Oct 17 ruling (VNA = Viral Nucleic Acid only, retired alternative; S199, per the S229 entry now in the ledger and MEMORY.md) was never appended to ruled-items.md, so the rotation legitimately treated VNA as unruled. The installed settled_ruling_guard skill''s filing step names only ''the notes that hold his section-numbered rulings'' with no authoritative path, so a ruling filed in chat notes or manuscript files stays invisible to the one ledger the rotation actually reads. The prompt also presented VNA as a loose thread without citing S199, which is the trust-costing shape the alignment record flags. Naming the single ledger, its format, and the cite-the-ruling rule for evidence-driven re-opens closes the exact gap that produced this repeat.'
