name: checkpointed_background_work
title: Checkpoint background and delegated work
description: Make delegated and scheduled work finish in completable slices with a saved checkpoint and a clear resume point, so an interrupted or unfinished run returns usable progress instead of nothing.
category: Work and knowledge
include_in_prompt: false
